name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck dialog whiptail
      - name: Smoke
        run: bash tests/smoke.test.sh
      - name: Host-check parsers
        run: bash tests/host-check.test.sh
      - name: ShellCheck
        run: |
          # SC2034: install.sh globals are shared with lib/*.sh via dynamic source
          shellcheck -S warning -e SC2015,SC2086,SC2162,SC2034 install.sh
          shellcheck -S warning tests/host-check.sh tests/host-check.test.sh
      - name: TUI backend flags
        run: |
          dialog --help 2>&1 | grep -q -- '--yes-label'
          dialog --help 2>&1 | grep -q -- '--ok-label'
          whiptail --help 2>&1 | grep -q -- '--yes-button'
          whiptail --help 2>&1 | grep -q -- '--ok-button'
